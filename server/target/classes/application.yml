spring:
  application:
    name: duty-module
  datasource:
    url: ${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/lick-kyta?useSSL=true&sslMode=PREFERRED&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8}
    username: ${DB_USER:4HVTRt8BGX7PPQC.root}
    password: ${DB_PASSWORD:g43UKf4lLVHGSutp}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  # ====== Redis Cache ======
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
    elasticsearch:
      repositories:
        enabled: ${ELASTICSEARCH_REPOSITORIES_ENABLED:false}
  cache:
    type: redis
    redis:
      time-to-live: 1800000   # 30 phút (ms) — phiên đăng nhập cache
  # ====== Elasticsearch ======
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 5s

server:
  port: ${SERVER_PORT:8080}

# ====== Bảo mật ======
app:
  security:
    jwt-secret: ${JWT_SECRET:change-me-min-32-chars-long-secret-key!!}
    jwt-expiration-minutes: ${JWT_EXPIRATION:480}
  cors:
    # Chỉ cho phép đúng domain frontend và Hugging Face Spaces
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:5173,https://donjaderoy-lich-kyta.hf.space,https://*.hf.space,https://huggingface.co}

# ====== Zalo (KHÔNG hard-code token) ======
zalo:
  app-id: ${ZALO_APP_ID:}
  app-secret: ${ZALO_APP_SECRET:}
  # Token mặc định cho kịch bản gửi bằng OA token tĩnh; ưu tiên token theo mapping OAuth
  access-token: ${ZALO_ACCESS_TOKEN:}
  refresh-token: ${ZALO_REFRESH_TOKEN:}
  callback-url: ${ZALO_CALLBACK_URL:http://localhost:8080/api/integrations/zalo/callback}
  webhook-secret: ${ZALO_WEBHOOK_SECRET:}
  # AES-256 key (base64, 32 bytes) để mã hoá access/refresh token khi lưu DB
  token-cipher-key: ${ZALO_TOKEN_CIPHER_KEY:}
  api:
    base-url: https://graph.zalo.me
    oauth-url: https://oauth.zaloapp.com

# ====== Notification pipeline ======
notification:
  retry:
    max-attempts: 3
    initial-backoff-ms: 2000
    multiplier: 2
  zalo:
    connect-timeout-ms: 5000
    read-timeout-ms: 8000

logging:
  level:
    com.example.duty: INFO
    # TUYỆT ĐỐI không log access token Zalo
    org.springframework.web.client: WARN
